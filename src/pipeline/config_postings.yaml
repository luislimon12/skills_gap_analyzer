# Role 1 config - which boards/roles to pull, rate limit notes.

adzuna:
  country: "ca"          # Canada (Adzuna country code: ca, us, gb, au, ...)
  results_per_page: 50
  max_pages_per_role: 5  # stay under the ~1000 calls/mo free tier
  request_delay_seconds: 1
  max_days_old: 90       # only postings from the last N days (0 = no limit)
  where: ""              # optional location filter, e.g. "Toronto"
  title_filter: true     # drop results whose title doesn't contain every word of the role
                         # (Adzuna's search is loose: "Data Analyst" also returns "Business Analyst")

greenhouse_boards: []    # add company board tokens here as strings, e.g. "airbnb"
lever_boards: []         # add company names here, e.g. "netflix"

# Roles fetched by `python -m src.pipeline.run_pipeline` with no --roles (each costs
# up to max_pages_per_role API calls). The dashboard offers more roles (config/settings.yaml)
# and fetches any of them on demand.
target_roles:
  - "Data Analyst"
  - "Software Developer"
  - "Registered Nurse"
  - "Personal Support Worker"
  - "Electrician"
  - "Accountant"
  - "Administrative Assistant"
  - "Retail Sales Associate"
  - "Warehouse Associate"
  - "AZ Driver"
  - "Line Cook"
  - "Early Childhood Educator"
