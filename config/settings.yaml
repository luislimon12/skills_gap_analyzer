# Shared config - all roles read from this file.
database_path: "data/skills_gap.db"

# Example roles offered in the dashboard. Any other job title can be typed in
# the dashboard; Adzuna searches it and O*NET occupations are matched automatically.
target_roles:
  # Tech and data
  - "Data Analyst"
  - "Data Scientist"
  - "Data Engineer"
  - "Business Analyst"
  - "Business Intelligence Analyst"
  - "Machine Learning Engineer"
  - "Software Developer"
  - "Web Developer"
  - "Full Stack Developer"
  - "DevOps Engineer"
  - "Cloud Engineer"
  - "Cybersecurity Analyst"
  - "IT Support"
  - "Network Administrator"
