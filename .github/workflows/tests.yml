# Runs the full test suite in the cloud, with no API keys and no network calls
# to job boards (tests/conftest.py blocks HTTP). Two jobs:
#   * sqlite   - the local-development setup
#   * postgres - mimics the Oracle VM: PostgreSQL 16 on the same machine as the worker
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skills_gap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:postgres@localhost:5432/skills_gap_test' || '' }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -ra --junitxml=test-report.xml
      - name: Report failures as annotations
        if: always()
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          if not os.path.exists("test-report.xml"):
              print("::error title=No test report::pytest did not produce a report (collection or install error)")
              raise SystemExit
          root = ET.parse("test-report.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total, failures, errors, skipped = (int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
          print(f"::notice title=Test totals ({os.environ.get('MATRIX_DB')})::{total} tests, {failures} failed, {errors} errors, {skipped} skipped")
          shown = 0
          for case in suite.iter("testcase"):
              problem = case.find("failure") if case.find("failure") is not None else case.find("error")
              if problem is None or shown >= 9:
                  continue
              shown += 1
              detail = (problem.get("message") or "") + " | " + (problem.text or "")[-1500:]
              detail = detail.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={case.get('classname')}.{case.get('name')}::{detail}")
          PY
        env:
          MATRIX_DB: ${{ matrix.database }}
